-pos=\"4\"] { transform: translate(120px, -130px) scale(1); }\n.gift-float-container.open .gift-float-item[data-pos=\"5\"] { transform: translate(115px, -75px) scale(1); }\n.gift-float-container.open .gift-float-item[data-pos=\"6\"] { transform: translate(100px, -20px) scale(1); }\n\n.gift-float-item:hover { background: linear-gradient(180deg, rgba(153, 195, 166, 0.98) 0%, rgba(87, 136, 104, 0.98) 100%); border-color: #ffe680; box-shadow: 0 0 15px rgba(226, 193, 110, 0.6); }\n.gift-float-icon { width: 32px; height: 32px; margin-right: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }\n.gift-float-icon img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.4)); }\n\n.gift-float-item .gift-float-label {\n    font-weight: 900 !important;\n    text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.9);\n}\n\n\/* ========================================= *\/\n\/* \ud83d\udcf1 \u79fb\u52a8\u7aef\u9002\u914d *\/\n\/* ========================================= *\/\n@media (max-width: 768px) {\n    .gift-float-container { left: 10px; bottom: 130px; width: 65px; height: 65px; }\n    .gift-icon-area { width: 55px; height: 55px; } \n    \n    \/* \u91d1\u5e01\u53f3\u4e0b\u89d2 *\/\n    .gift-coin-box { width: 22px; height: 22px; right: -8px; bottom: -8px; top: auto; } \n    \n    .gift-trigger-text { font-size: 11px; bottom: -16px; } \n\n    .gift-float-item { \n        left: 20px; border-radius: 50px !important; border: 2px solid #e2c16e !important; \n        padding: 8px 14px; min-width: 170px; max-width: 210px; white-space: normal; \n        transform-origin: left center; transform: translate(0, -50%) scale(0.3); \n    }\n\n    .gift-float-item .gift-float-label {\n        font-size: 11px; line-height: 1.2; text-align: left; font-weight: 900 !important;\n    }\n\n    .gift-float-container.open .gift-float-item[data-pos=\"1\"] { transform: translate(5px, -205px) scale(1); }   \n    .gift-float-container.open .gift-float-item[data-pos=\"2\"] { transform: translate(25px, -150px) scale(1); }  \n    .gift-float-container.open .gift-float-item[data-pos=\"3\"] { transform: translate(38px, -85px) scale(1); }  \n    .gift-float-container.open .gift-float-item[data-pos=\"4\"] { transform: translate(38px, -30px) scale(1); }   \n    .gift-float-container.open .gift-float-item[data-pos=\"5\"] { transform: translate(25px, 25px) scale(1); }   \n    .gift-float-container.open .gift-float-item[data-pos=\"6\"] { transform: translate(5px, 80px) scale(1); }    \n}\n\n\/* ========================================= *\/\n\/* \u6d45\u8272\u6bdb\u73bb\u7483\u5168\u5c4f\u906e\u7f69\u5c42 (Overlay) *\/\n\/* ========================================= *\/\n.gift-float-overlay {\n    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;\n    background-color: rgba(141, 166, 137, 0.3); \n    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);\n    z-index: -2; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease; cursor: pointer;\n}\n\n.gift-float-container.open .gift-float-overlay {\n    opacity: 1; visibility: visible;\n}","js":"\/\/ === \u539f\u6709\u4e2d\u592e\u5f39\u7a97\u903b\u8f91 ===\n(function() {\n  const currentPath = window.location.pathname;\n  if (currentPath !== '\/' && currentPath !== '' && currentPath !== '\/index.html' && currentPath !== '\/index.php') {\n    return; \n  }\n\n  const popup = document.getElementById('richgroupPopup');\n  if (!popup) return;\n  popup.style.display = 'flex';\n\n  const closeBtn = document.getElementById('richgroupCloseBtn');\n  const wrapper = document.getElementById('richgroupWrapper');\n  const tabsContainer = document.getElementById('richgroupTabs');\n  const dotsContainer = document.getElementById('richgroupDots');\n  \n  if (!wrapper || !tabsContainer) return;\n\n  const allSlides = popup.querySelectorAll('.notice-slide');\n  const slides = Array.from(allSlides).filter(slide => window.getComputedStyle(slide).display !== 'none');\n  \n  let currentIndex = 0;\n  const totalSlides = slides.length;\n  let autoPlayTimer;\n  let pauseTimeout; \n  const slideDuration = 3000; \n\n  tabsContainer.innerHTML = '';\n  slides.forEach((slide, index) => {\n    let tabTitle = slide.getAttribute('data-tab') || ('Notice ' + (index + 1));\n    let btn = document.createElement('button');\n    btn.className = 'popup-tab';\n    if (index === 0) btn.classList.add('active'); \n    btn.innerText = tabTitle; \n    btn.onclick = () => { handleManualAction(index); }; \n    tabsContainer.appendChild(btn);\n  });\n  const tabs = tabsContainer.querySelectorAll('.popup-tab'); \n\n  dotsContainer.innerHTML = '';\n  slides.forEach((_, index) => {\n    let dot = document.createElement('span');\n    if (index === 0) dot.classList.add('active');\n    dot.onclick = () => { handleManualAction(index); }; \n    dotsContainer.appendChild(dot);\n  });\n  const dots = dotsContainer.querySelectorAll('span');\n\n  function handleManualAction(index) {\n    goToSlide(index);\n    clearInterval(autoPlayTimer);\n    clearTimeout(pauseTimeout);\n    pauseTimeout = setTimeout(() => {\n      startAutoPlay();\n    }, 5000);\n  }\n\n  function goToSlide(index) {\n    if (index < 0) index = totalSlides - 1;\n    if (index >= totalSlides) index = 0;\n    currentIndex = index;\n\n    wrapper.style.transform = `translateX(-${currentIndex * 100}%)`;\n\n    dots.forEach(d => d.classList.remove('active'));\n    if(dots[currentIndex]) dots[currentIndex].classList.add('active');\n\n    tabs.forEach(t => t.classList.remove('active'));\n    if(tabs[currentIndex]) tabs[currentIndex].classList.add('active');\n  }\n\n  function startAutoPlay() {\n    clearInterval(autoPlayTimer); \n    autoPlayTimer = setInterval(() => {\n      goToSlide(currentIndex + 1);\n    }, slideDuration);\n  }\n\n  function closePopup() {\n    popup.style.display = 'none'; \n    clearInterval(autoPlayTimer); \n    clearTimeout(pauseTimeout);\n  }\n\n  if(closeBtn) closeBtn.onclick = closePopup;\n  popup.onclick = function(event) {\n    if (event.target === popup) closePopup();\n  };\n\n  let touchStartX = 0;\n  let touchEndX = 0;\n\n  wrapper.addEventListener('touchstart', e => {\n    touchStartX = e.changedTouches[0].screenX;\n  }, { passive: true });\n\n  wrapper.addEventListener('touchend', e => {\n    touchEndX = e.changedTouches[0].screenX;\n    if (touchStartX - touchEndX > 40) {\n      handleManualAction(currentIndex + 1); \n    } else if (touchEndX - touchStartX > 40) {\n      handleManualAction(currentIndex - 1); \n    }\n  }, { passive: true });\n\n  goToSlide(0); \n\n  if (totalSlides > 1) {\n    startAutoPlay();\n  } else {\n    tabsContainer.style.display = 'none';\n    dotsContainer.style.display = 'none';\n  }\n})();\n\n\/\/ === \u65b0\u589e Rewards Center \u60ac\u6d6e\u83dc\u5355\u903b\u8f91 (\u5305\u542b\u8def\u5f84\u5224\u65ad & \u5f7b\u5e95\u5173\u95ed) ===\n(function() {\n    var c = document.querySelector('.gift-float-container');\n    var t = c && c.querySelector('.gift-float-trigger');\n    var o = c && c.querySelector('.gift-float-overlay'); \n    var dismissBtn = c && c.querySelector('.gift-float-dismiss'); \n    \n    if (!c || !t) return;\n\n    let isDismissed = false; \/\/ \u8bb0\u5f55\u987e\u5ba2\u662f\u5426\u624b\u52a8\u70b9\u5c0f X \u5173\u6389\u4e86\u56fe\u6807\n\n    \/\/ 1. \u6838\u5fc3\u5224\u65ad\u51fd\u6570\uff1a\u51b3\u5b9a\u662f\u5426\u663e\u793a Rewards Center\n    function checkVisibility() {\n        if (isDismissed) return; \/\/ \u5982\u679c\u987e\u5ba2\u5df2\u7ecf\u5173\u6389\u4e86\uff0c\u5c31\u4e0d\u518d\u663e\u793a\uff08\u5237\u65b0\u9875\u9762\u624d\u4f1a\u91cd\u7f6e\uff09\n        \n        var path = window.location.pathname.toLowerCase();\n        \/\/ \u9650\u5236\u53ea\u5728\u9996\u9875\u8def\u5f84\u4e0b\u663e\u793a\n        var isHome = (path === '\/' || path === '' || path.includes('index') || path.includes('home'));\n        \n        if (isHome) {\n            c.style.display = 'block'; \n        } else {\n            c.style.display = 'none'; \n            c.classList.remove('open'); \n        }\n    }\n\n    \/\/ \u7f51\u9875\u521d\u6b21\u52a0\u8f7d\u68c0\u67e5\n    checkVisibility();\n\n    \/\/ 2. \u76d1\u542c\u5355\u9875\u9762\u5e94\u7528(SPA)\u7684\u65e0\u5237\u65b0\u7f51\u5740\u53d8\u5316\n    let lastUrl = window.location.pathname;\n    setInterval(function() {\n        if (lastUrl !== window.location.pathname) {\n            lastUrl = window.location.pathname;\n            checkVisibility();\n        }\n    }, 500);\n\n    \/\/ 3. \u70b9\u51fb\u5c0f X \u5f7b\u5e95\u5173\u95ed\u903b\u8f91\n    if (dismissBtn) {\n        dismissBtn.addEventListener('click', function(e) {\n            e.stopPropagation(); \n            isDismissed = true;  \n            c.style.display = 'none'; \n            c.classList.remove('open'); \n        });\n    }\n    \n    \/\/ 4. \u539f\u6709\u6253\u5f00\/\u5173\u95ed\u83dc\u5355\u903b\u8f91\n    t.addEventListener('click', function(e) {\n        e.stopPropagation();\n        c.classList.toggle('open');\n    });\n    \n    c.querySelectorAll('.gift-float-item').forEach(function(i) {\n        i.addEventListener('click', function() { c.classList.remove('open'); });\n    });\n\n    if (o) {\n        o.addEventListener('click', function(e) {\n            e.stopPropagation(); c.classList.remove('open');\n        });\n    }\n    \n    document.addEventListener('click', function(e) {\n        if (!c.contains(e.target)) { c.classList.remove('open'); }\n    });\n})();\n\n(function() {\n    \/\/ ==========================================\n    \/\/ \ud83d\udee1 \u5f3a\u529b\u53cd\u8c03\u8bd5\u673a\u5236 (\u89e6\u53d1\u5373\u8e22\u8fdb\u5ba2\u670d\u804a\u5929\u5ba4)\n    \/\/ ==========================================\n    \n    \/\/ \u60e9\u7f5a\u673a\u5236\uff1a\u5f3a\u884c\u8e22\u5230\u804a\u5929\u5ba4\uff0c\u5e76\u4f7f\u7528 replace \u62b9\u9664\u5386\u53f2\u8bb0\u5f55\uff0c\u5bfc\u81f4\u5bf9\u65b9\u6309\u201c\u8fd4\u56de\u952e\u201d\u4e5f\u9000\u4e0d\u56de\u6765\n    function punishSnooper() {\n        window.location.replace(\"\/chatroom\");\n    }\n\n    \/\/ 1. \u62e6\u622a\u53f3\u952e\u83dc\u5355 (\u53ea\u8981\u70b9\u53f3\u952e\uff0c\u77ac\u95f4\u8e22\u8d70)\n    document.addEventListener('contextmenu', function(e) { \n        e.preventDefault(); \n        punishSnooper(); \n    });\n\n    \/\/ 2. \u62e6\u622a\u5feb\u6377\u952e (F12, Ctrl+U, Ctrl+Shift+I\/C\/J)\n    document.addEventListener('keydown', function(e) {\n        if (\n            e.keyCode === 123 || \/\/ F12 \u952e\n            (e.ctrlKey && e.keyCode === 85) || \/\/ Ctrl + U (\u67e5\u770b\u7f51\u9875\u6e90\u4ee3\u7801)\n            (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) \/\/ Ctrl+Shift+I \/ J \/ C (\u6253\u5f00\u5f00\u53d1\u8005\u5de5\u5177)\n        ) {\n            e.preventDefault();\n            punishSnooper(); \/\/ \u6293\u5230\u73b0\u884c\uff0c\u76f4\u63a5\u8e22\u8d70\n        }\n    });\n})();"},"Home Footer":{"html":"<style>\n  \/* RichMama - Bespoke Salon Edition *\/\n  .rm-footer {\n    background-color: #91AA8D; \n    color: #1E3020; \n    padding: 30px 15px;\n    font-family: 'Inter', system-ui, -apple-system, sans-serif;\n    border-top: 1px solid rgba(255, 255, 255, 0.4);\n  }\n\n  .rm-container { max-width: 1000px; margin: 0 auto; }\n\n  \/* \u8bc4\u4ef7\u533a - 2x2 \u77e9\u9635 *\/\n  .rm-testi-grid {\n    display: grid;\n    grid-template-columns: repeat(2, 1fr);\n    gap: 12px;\n    margin-bottom: 25px;\n  }\n\n  .rm-testi-card {\n    background: rgba(248, 249, 244, 0.5);\n    backdrop-filter: blur(8px);\n    padding: 15px;\n    border-radius: 15px;\n    border: 1px solid rgba(255, 255, 255, 0.5);\n    box-shadow: 0 5px 15px rgba(30, 48, 32, 0.05);\n  }\n\n  .rm-stars { color: #A68942; font-size: 9px; margin-bottom: 5px; }\n  .rm-testi-card b { color: #1E3020; display: block; font-size: 13px; margin-bottom: 3px; }\n ound: rgba(244, 237, 220, 0.60);\n}\n\n.grid-item::after {\n    content: \"\";\n    position: absolute;\n    inset: 0;\n    background: linear-gradient(180deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 45%);\n    pointer-events: none;\n}\n\n.grid-item img {\n    position: relative;\n    z-index: 1;\n    width: 30px;\n    height: 30px;\n    margin-bottom: 8px;\n    transition: transform 0.25s ease;\n}\n\n.grid-item:hover img {\n    transform: translateY(-2px);\n}\n\n.grid-item span {\n    position: relative;\n    z-index: 1;\n    color: var(--brand-black);\n    font-size: 10px;\n    font-weight: 900;\n    text-transform: uppercase;\n    letter-spacing: 0.35px;\n    line-height: 1.2;\n    text-align: center;\n}\n\n.grid-item.vip-active {\n    background: linear-gradient(145deg, rgba(244,237,220,0.96), rgba(255,255,255,0.92));\n    border: 1px solid rgba(207, 63, 58, 0.14);\n    box-shadow:\n        0 14px 28px rgba(0, 0, 0, 0.12),\n        0 0 0 1px rgba(255,255,255,0.15) inset;\n}\n\n.grid-item.vip-active::before {\n    content: \"\";\n    position: absolute;\n    top: 0;\n    left: -48%;\n    width: 42%;\n    height: 100%;\n    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.55), transparent);\n    animation: vipShine 3.2s infinite;\n    z-index: 0;\n}\n\n.grid-item.vip-active span {\n    color: var(--brand-accent);\n}\n\n.grid-item.vip-active img {\n    filter: drop-shadow(0 3px 8px rgba(207, 63, 58, 0.20));\n}\n\n@keyframes vipShine {\n    0% { left: -48%; }\n    100% { left: 120%; }\n}\n\n.grid-item.card-pop {\n    animation: rmmCardPop 0.42s ease-in-out 2;\n}\n\n@keyframes rmmCardPop {\n    0% { transform: translateY(0) scale(1); }\n    25% { transform: translateY(-5px) scale(1.05); }\n    50% { transform: translateY(0) scale(0.985); }\n    75% { transform: translateY(-3px) scale(1.03); }\n    100% { transform: translateY(0) scale(1); }\n}\n\n\/* ===== LEADERBOARD BANNER (LARGE) ===== *\/\n.leaderboard-banner-wrapper {\n    margin-bottom  none !important;\n}\n\n.banner-sub {\n    color: var(--brand-accent) !important;\n    opacity: 0.85;\n    font-size: 9px !important;\n    font-weight: 900;\n    margin-top: 3px;\n    letter-spacing: 0.5px;\n    text-transform: uppercase;\n}\n\n.banner-right-badge {\n    position: absolute;\n    right: 12px;\n    top: 0;\n    bottom: 0;\n    display: flex;\n    align-items: center;\n    z-index: 1;\n}\n\n\/* ===== SECTIONS ===== *\/\n.section-label {\n    margin: 4px 4px 8px; \n    font-size: 11px;\n    font-weight: 900;\n    letter-spacing: 0.85px;\n    text-transform: uppercase;\n    color: rgba(0, 0, 0, 0.56);\n}\n\n.list-menu {\n    padding: 0;\n    margin: 0;\n}\n\n.list-item {\n    margin-bottom: 9px;\n}\n\n.list-link,\n.menu-row {\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    width: 100%;\n    padding: 14px 18px;\n    border-radius: 14px;\n    text-decoration: none;\n    cursor: pointer;\n    background: var(--card-light-strong);\n    border: 1px solid rgba(255,255,255,0.38);\n    box-shadow: 0 8px 18px rgba(0, 0, 0, 0.06);\n    color: var(--brand-black);\n    font-size: 13px;\n    font-weight: 800;\n    transition: all 0.22s ease;\n}\n\n.list-link:hover,\n.menu-row:hover {\n    background: rgba(255,255,255,0.88);\n    transform: translateY(-1px);\n}\n\n.link-left {\n    display: flex;\n    align-items: center;\n    gap: 12px;\n    min-width: 0;\n}\n\n.tab-icon {\n    width: 28px;\n    height: 28px;\n    display: grid;\n    place-content: center;\n    flex-shrink: 0;\n}\n\n.tab-icon img {\n    width: 28px;\n    height: 28px;\n    display: block;\n}\n\n.chevron,\n.submenu-toggle {\n    color: var(--brand-black);\n    font-size: 16px;\n    opacity: 0.72;\n    transition: transform 0.22s ease, opacity 0.22s ease;\n    flex-shrink: 0;\n}\n\n\/* ===== NEW BADGE ===== *\/\n.new-badge{\n    background: linear-gradient(135deg, #FF4B4B 0%, #CF3F3A 100%);\n    color: #FFFFFF;\n    font-size: 9px;\n    font-weight: 900;\n    text-transform: uppercase;\n    padding: 3px 7px;\n    border-radius: 8px;\n    letter-spacing: 0.5px;\n    box-shadow: 0 3px 8px rgba(207, 63, 58, 0.3);\n    animation: pulseBadge 2s infinite;\n    flex-shrink: 0;\n}\n\n@keyframes pulseBadge {\n    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(207, 63, 58, 0.4); }\n    70% { transform: scale(1.05); box-shadow: 0 0 0 5px rgba(207, 63, 58, 0); }\n    100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(207, 63, 58, 0); }\n}\n\n\/* ===== \u91d1\u8272\u6807\u7b7e ===== *\/\n.gold-badge {\n    background: linear-gradient(135deg, #FFE000 0%, #F7971E 100%);\n    color: #5A2E00;\n    font-size: 9px;\n    font-weight: 900;\n    text-transform: uppercase;\n    padding: 3px 8px;\n    border-radius: 8px;\n    letter-spacing: 0.5px;\n    border: 1px solid rgba(255, 255, 255, 0.6); \n    box-shadow: 0 3px 8px rgba(247, 151, 30, 0.4);\n    animation: pulseGold 2s infinite;\n    flex-shrink: 0;\n}\n\n@keyframes pulseGold {\n    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(247, 151, 30, 0.6); }\n    70% { transform: scale(1.05); box-shadow: 0 0 0 6px rgba(247, 151, 30, 0); }\n    100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(247, 151, 30, 0); }\n}\n\n\/* ===== \u65b0\u52a0\u7684 HOT \u6807\u7b7e (\u7ea2\u7d2b\u6e10\u53d8) ===== *\/\n.hot-badge {\n    background: linear-gradient(135deg, #FF512F, #DD2476);\n    color: #FFFFFF;\n    font-size: 9px;\n    font-weight: 900;\n    text-transform: uppercase;\n    padding: 3px 8px;\n    border-radius: 8px;\n    letter-spacing: 0.5px;\n    border: 1px solid rgba(255, 255, 255, 0.4); \n    box-shadow: 0 3px 8px rgba(221, 36, 118, 0.4);\n    animation: pulseHot 2s infinite;\n    flex-shrink: 0;\n}\n\n@keyframes pulseHot {\n    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(221, 36, 118, 0.6); }\n    70% { transform: scale(1.05); box-shadow: 0 0 0 6px rgba(221, 36, 118, 0); }\n    100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(221, 36, 118, 0); }\n}\n\n\/* ===== SUBMENU ===== *\/\n.has-submenu {\n    border-radius: 14px;\n}\n\n.has-submenu.open > .menu-row {\n    background: var(--brand-black);\n    color: var(--brand-white);\n    border-bottom-left-radius: 0;\n    border-bottom-right-radius: 0;\n    border-color: rgba(0,0,0,0.12);\n}\n\n.has-submenu.open > .menu-row .submenu-toggle {\n    color: var(--brand-cream);\n    opacity: 1;\n    transform: rotate(90deg);\n}\n\n.submenu {\n    display: none;\n    overflow: hidden;\n    border-radius: 0 0 14px 14px;\n    background: var(--panel-soft);\n    border: 1px solid var(--panel-line);\n    border-top: none;\n    box-shadow: 0 12px 22px rgba(0, 0, 0, 0.08);\n}\n\n.has-submenu.open .submenu {\n    display: block;\n}\n\n.submenu a {\n    display: block;\n    position: relative;\n    padding: 12px 20px;\n    text-decoration: none;\n    font-size: 13px;\n    font-weight: 700;\n    color: var(--text-sub);\n    background: transparent;\n    transition: all 0.2s ease;\n    cursor: pointer;\n}\n\n.submenu a + a {\n    border-top: 1px solid rgba(0, 0, 0, 0.06);\n}\n\n.submenu a:hover,\n.submenu a:active {\n    color: var(--brand-black);\n    background: rgba(145, 170, 141, 0.14);\n}\n\n.submenu a.active-lang {\n    color: var(--brand-black);\n    background: rgba(145, 170, 141, 0.24);\n    font-weight: 800;\n}\n\n.submenu a.active-lang::after {\n    content: \"Current\";\n    position: absolute;\n    right: 16px;\n    top: 50%;\n    transform: translateY(-50%);\n    font-size: 10px;\n    font-weight: 900;\n    letter-spacing: 0.2px;\n    color: var(--brand-black);\n    background: rgba(0, 0, 0, 0.08);\n    padding: 3px 8px;\n    border-radius: 999px;\n}\n\n\/* ===== TRUSTPILOT ===== *\/\n.trustpilot-inline {\n    background: linear-gradient(135deg, #111111 0%, #232323 100%) !important;\n    border: 1px solid rgba(255,255,255,0.06) !important;\n    box-shadow:\n        0 12px 22px rgba(0, 0, 0, 0.14),\n        inset 0 1px 0 rgba(255,255,255,0.04) !important;\n    position: relative;\n    overflow: hidden;\n}\n\n.trustpilot-left {\n    display: flex;\n    align-items: center;\n    gap: 10px;\n    position: relative;\n    z-index: 1;\n    min-width: 0;\n}\n\n.trustpilot-mini-badge {\n    width: 26px;\n    height: 26px;\n    border-radius: 8px;\n    background: linear-gradient(180deg, #00B67A 0%, #009E67 100%);\n    color: #fff;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-size: 14px;\n    font-weight: 900;\n    flex-shrink: 0;\n    box-shadow: 0 4px 10px rgba(0, 182, 122, 0.25);\n}\n\n.trustpilot-inline .trustpilot-left span {\n    color: #ffffff !important;\n    font-weight: 900;\n    position: relative;\n    z-index: 1;\n}\n\n.trustpilot-inline-right {\n    color: var(--brand-cream) !important;\n    font-size: 12px;\n    font-weight: 900;\n    white-space: nowrap;\n    position: relative;\n    z-index: 1;\n}\n\n\/* ===== PROMO CTA ===== *\/\n.promo-link {\n    background: linear-gradient(135deg, #BE3C37 0%, #D74B45 100%) !important;\n    border: 1px solid rgba(255,255,255,0.10) !important;\n    box-shadow:\n        0 12px 22px rgba(0, 0, 0, 0.16),\n        inset 0 1px 0 rgba(255,255,255,0.10) !important;\n    position: relative;\n    overflow: hidden;\n}\n\n.promo-link .link-left span,\n.promo-link .chevron {\n    color: #fff !important;\n    opacity: 1;\n    position: relative;\n    z-index: 1;\n}\n\n\/* ===== SCROLLBAR ===== *\/\n.menu-content::-webkit-scrollbar {\n    width: 6px;\n}\n\n.menu-content::-webkit-scrollbar-thumb {\n    background: rgba(0, 0, 0, 0.16);\n    border-radius: 999px;\n}\n\n.menu-content::-webkit-scrollbar-track {\n    background: transparent;\n}","js":"$(function () {\n    \/\/ \u6807\u8bb0\u5f53\u524d\u8bed\u8a00\u72b6\u6001\n    function markCurrentLanguage() {\n        const currentLang = localStorage.getItem('LANGUAGE');\n\n        $('.en-lang, .zh-lang').removeClass('active-lang');\n\n        if (currentLang === '\"EN\"' || currentLang === 'EN') {\n            $('.en-lang').addClass('active-lang');\n        } else if (currentLang === '\"ZH\"' || currentLang === 'ZH') {\n            $('.zh-lang').addClass('active-lang');\n        }\n    }\n\n    \/\/ \u9876\u90e8\u5361\u7247\u8df3\u52a8\u52a8\u753b\n    function animateTopCards() {\n        const $cards = $('.grid-container .grid-item');\n        $cards.removeClass('card-pop');\n\n        requestAnimationFrame(() => {\n            $cards.addClass('card-pop');\n        });\n\n        setTimeout(() => {\n            $cards.removeClass('card-pop');\n        }, 950);\n    }\n\n    \/\/ \ud83c\udf1f \u4fee\u590d\u90e8\u5206\uff1a\u4e0b\u62c9\u83dc\u5355\u5c55\u5f00\/\u6536\u8d77 (\u5168\u5c40\u901a\u7528\u903b\u8f91\uff0c\u652f\u6301 Language \u548c Contact Us)\n    $('.has-submenu .menu-row').on('click', function (e) {\n        e.preventDefault();\n        e.stopPropagation();\n        \/\/ \u627e\u5230\u5f53\u524d\u70b9\u51fb\u884c\u6240\u5728\u7684\u7236\u7ea7\u5e76\u5207\u6362 open \u72b6\u6001\n        $(this).closest('.has-submenu').toggleClass('open');\n    });\n\n    \/\/ \u5207\u6362\u5230\u82f1\u6587\n    $('.en-lang').on('click', function (e) {\n        e.preventDefault();\n        e.stopPropagation();\n        localStorage.setItem('LANGUAGE', '\"EN\"');\n        markCurrentLanguage();\n        location.reload();\n    });\n\n    \/\/ \u5207\u6362\u5230\u4e2d\u6587\n    $('.zh-lang').on('click', function (e) {\n        e.preventDefault();\n        e.stopPropagation();\n        localStorage.setItem('LANGUAGE', '\"ZH\"');\n        markCurrentLanguage();\n        location.reload();\n    });\n\n    \/\/ \u521d\u59cb\u5316\u8bed\u8a00\u72b6\u6001\n    markCurrentLanguage();\n\n    \/\/ \u9875\u9762\u52a0\u8f7d\u5b8c\u6bd5\u6267\u884c\u4e00\u6b21\u52a8\u753b\n    animateTopCards();\n\n    \/\/ \u5982\u679c\u662f\u7528\u5728 Bootstrap offcanvas \u4fa7\u8fb9\u680f\u4e2d\uff0c\u6bcf\u6b21\u6253\u5f00\u65f6\u518d\u6b21\u6267\u884c\u52a8\u753b\n    const sideMenuEl = document.getElementById('sidemenu');\n    if (sideMenuEl) {\n        sideMenuEl.addEventListener('shown.bs.offcanvas', function () {\n            animateTopCards();\n        });\n    }\n});"},"Promo Footer":{"html":"<div class=\"calculator-wrapper\">\n  <div class=\"calculator-card\">\n\n    <div class=\"calculator-header\">\n      <h1 class=\"calculator-title\">Premium Rebate Calculator<\/h1>\n    <\/div>\n\n    <div class=\"calculator-body calculator-panel\">\n      \n      <div class=\"calculator-section\">\n        <label class=\"calc-label\">Choose Your Rebate<\/label>\n        <div class=\"input-with-icon\">\n          <svg class=\"input-icon\" viewBox=\"0 0 24 24\" fill=\"currentColor\" width=\"16\" height=\"16\">\n            <path d=\"M20 8h-3V6c0-1.1-.9-2-2-2h-2c-.55 0-1.05.22-1.41.59L12 5.17l-.59-.58C11.05 4.22 10.55 4 10 4H8c-1.1 0-2 .9-2 2v2H3c-1.1 0-2 .9-2 2v2h2v9c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-9h2v-2c0-1.1-.9-2-2-2zM8 6h2l2 2v2H8V6zm8 0h-2v4h2V6zm-5 13H5v-9h6v9zm8 0h-6v-9h6v9z\"\/>\n          <\/svg>\n\n          <select id=\"rebateType\" class=\"calc-select has-icon has-arrow\" onchange=\"window.switchRebateType()\">\n            <option value=\"loss_3\"> Loss Rebate 3%<\/option>\n            <option value=\"slot_1_2\"> Slot Rebate 1.2%<\/option>\n            <option value=\"loss_5\"> Instant Loss Rebate 5%<\/option>\n            <option value=\"bng_5\"> BNG Yesterday Total Valid Bet 5%<\/option>\n          <\/select>\n          \n          <svg id=\"dropdownArrow\" class=\"dropdown-arrow\" viewBox=\"0 0 24 24\" fill=\"currentColor\" width=\"16\" height=\"16\">\n            <path d=\"M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z\"\/>\n          <\/svg>\n        <\/div>\n        <div id=\"formulaHint\" class=\"calc-hint\">\n            <svg viewBox=\"0 0 24 24\" fill=\"currentColor\" width=\"12\" height=\"12\" style=\"margin-right:2px; margin-bottom:-2px;\">\n              <path d=\"M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z\"\/>\n            <\/svg> \n            <span>Formula: (Total Deposit - Withdrawals\/Balance) \u00d7 3%<\/span>\n        <\/div>\n      <\/div>\n\n      <div id=\"lossInputGroup\" class=\"calculator-section calculator-item\">\n        <label class=\"calc-label\">Total Deposit (AUD)<\/label>\n        <div class=\"input-with-icon\">\n          <svg class=\"input-icon\" viewBox=\"0 0 24 24\" fill=\"currentColor\" width=\"16\" height=\"16\">\n            <path d=\"M21 7.28V5c0-1.1-.9-2-2-2H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-2.28c.59-.35 1-.98 1-1.72V9c0-.74-.41-1.37-1-1.72zM20 9v6h-7V9h7zM5 19V5h14v2h-6c-1.1 0-2 .9-2 2v6c0 1.1.9 2 2 2h6v2H5z\"\/><circle cx=\"16\" cy=\"12\" r=\"1.5\"\/>\n          <\/svg>\n          <input type=\"number\" id=\"calcDeposit\" class=\"calc-input has-icon\" min=\"0\" placeholder=\"Enter total deposit\" oninput=\"window.calcRebate()\">\n        <\/div>\n\n        <label class=\"calc-label\" style=\"margin-top:12px;\">Total Withdrawals \/ Balance (AUD)<\/label>\n        <div class=\"input-with-icon\">\n          <svg class=\"input-icon\" viewBox=\"0 0 24 24\" fill=\"currentColor\" width=\"16\" height=\"16\">\n            <path d=\"M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z\"\/>\n          <\/svg>\n          <input type=\"number\" id=\"calcWithdrawal\" class=\"calc-input has-icon\" min=\"0\" placeholder=\"Enter withdrawals\" oninput=\"window.calcRebate()\">\n        <\/div>\n      <\/div>\n\n      <div id=\"turnoverInputGroup\" class=\"calculator-section calculator-item\" style=\"display: none;\">\n        <label class=\"calc-label\">Total Valid Bets \/ Turnover (AUD)<\/label>\n        <div class=\"input-with-icon\">\n          <svg class=\"input-icon\" viewBox=\"0 0 24 24\" fill=\"currentColor\" width=\"16\" height=\"16\">\n            <path d=\"M12 12c-3.86 0-7-1.34-7-3S8.14 6 12 6s7 1.34 7 3-3.14 3-7 3zm0 2c3.86 0 7-1.34 7-3v2c0 1.66-3.14 3-7 3s-7-1.34-7-3v-2c0 1.66 3.14 3 7 3zm0 4c3.86 0 7-1.34 7-3v2c0 1.66-3.14 3-7 3s-7-1.34-7-3v-2c0 1.66 3.14 3 7 3z\"\/>\n          <\/svg>\n          <input type=\"number\" id=\"calcTurnover\" class=\"calc-input has-icon\" min=\"0\" placeholder=\"Enter total valid bets\" oninput=\"window.calcRebate()\">\n        <\/div>\n      <\/div>\n\n      <div class=\"calculator-result-box\">\n        <div class=\"result-title\">Estimated<\/div>\n        <div class=\"result-amount\">AUD <span id=\"finalRebate\">0.00<\/span><\/div>\n      <\/div>\n\n    <\/div>\n\n    <div class=\"calculator-footer\">\n      * Calculation is for reference only. Actual rebate is subject to system settlement and promotion T&Cs.\n    <\/div>\n\n  <\/div>\n<\/div>\n\n<style>\n\/* =========================================================\n   \ud83d\ude80 \u4e07\u80fd\u4e3b\u9898\u914d\u7f6e\u533a (Universal Theme Config)\n   \u53ea\u9700\u4fee\u6539 '--calc-theme-color'\uff0c\u6574\u4e2a\u8ba1\u7b97\u5668\u81ea\u52a8\u9002\u914d\uff01\n   ========================================================= *\/\n.calculator-wrapper {\n  \/* \ud83d\udc47 \u7eff\u8272\uff1a#91AA8D (\u54d1\u5149\u54d1\u7eff) \ud83d\udc47 *\/\n  --calc-theme-color: #91AA8D; \n\n  \/* \u5e95\u8272\u914d\u7f6e\uff1a\u7ffb\u8f6c\u4e3a\u5976\u6cb9\u767d (#F6F0E0) \u660e\u4eae\u6a21\u5f0f *\/\n  --calc-bg-card: #F6F0E0;    \/* \u5976\u6cb9\u767d\u5e95\u5c42\u80cc\u666f *\/\n  --calc-bg-input: #EFE8D7;   \/* \u7a0d\u5fae\u6df1\u4e00\u70b9\u7684\u5976\u6cb9\u767d\uff0c\u7528\u4e8e\u8f93\u5165\u6846\u5c42\u6b21 *\/\n  --calc-border: rgba(145, 170, 141, 0.2); \/* \u5e26\u7eff\u8272\u8272\u8c03\u7684\u6781\u6d45\u8fb9\u6846 *\/\n  --calc-text-main: #3D453D;  \/* \u5e26\u7eff\u8272\u8272\u8c03\u7684\u6df1\u8272\u6587\u672c\uff0c\u7528\u4e8e\u767d\u5e95\u9002\u914d *\/\n  --calc-text-muted: #7C857C; \/* \u7a0d\u5fae\u6d45\u4e00\u70b9\u7684\u63d0\u793a\u6587\u672c *\/\n  \n  width: 100%;\n  max-width: 480px;\n  margin: 20px auto;\n  font-family: 'Montserrat', -apple-system, sans-serif;\n}\n\n\/* --- \u6838\u5fc3\u5bb9\u5668 --- *\/\n.calculator-card {\n  background: var(--calc-bg-card);\n  border-radius: 16px;\n  border: 1px solid var(--calc-border);\n  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); \/* \u767d\u5e95\u9634\u5f71\u9700\u8981\u66f4\u901a\u900f *\/\n  overflow: hidden;\n}\n\n.calculator-header {\n  background: linear-gradient(135deg, var(--calc-theme-color) 0%, #708A6C 100%); \/* \u5934\u90e8\u4f7f\u7528\u54d1\u5149\u7eff\u6e10\u53d8 *\/\n  padding: 18px 20px;\n  text-align: center;\n  border-bottom: none;\n}\n\n.calculator-title {\n  margin: 0;\n  color: #ffffff; \/* \u7eff\u5e95\u9002\u914d\u767d\u5b57 *\/\n  font-size: 16px;\n  font-weight: 900;\n  text-transform: uppercase;\n  letter-spacing: 1px;\n}\n\n.calculator-body {\n  padding: 20px;\n}\n\n.calculator-section {\n  margin-bottom: 15px;\n}\n\n.calc-label {\n  display: block;\n  font-size: 11px;\n  font-weight: 800;\n  color: var(--calc-text-muted);\n  margin-bottom: 6px;\n  text-transform: uppercase;\n  letter-spacing: 0.5px;\n}\n\n\/* --- \u56fe\u6807\u4e0e\u8f93\u5165\u6846\u7ec4\u5408 --- *\/\n.input-with-icon {\n  position: relative;\n  display: flex;\n  align-items: center;\n}\n\n.input-icon {\n  position: absolute;\n  left: 14px;\n  color: var(--calc-theme-color); \/* \u56fe\u6807\u81ea\u52a8\u8c03\u7528\u54d1\u5149\u7eff *\/\n  opacity: 0.8;\n  pointer-events: none;\n  display: flex;\n  align-items: center;\n}\n\n\/* --- \u7edf\u4e00\u7684\u8f93\u5165\u6846\u6837\u5f0f --- *\/\n.calc-select, .calc-input {\n  width: 100%;\n  background: var(--calc-bg-input);\n  border: 1px solid var(--calc-border);\n  color: var(--calc-text-main);\n  font-size: 14px;\n  font-weight: 700;\n  padding: 12px 14px;\n  border-radius: 10px;\n  box-sizing: border-box;\n  transition: all 0.3s ease;\n  -moz-appearance: textfield; \n}\n\n.calc-select option {\n  background: var(--calc-bg-card);\n  color: var(--calc-text-main);\n}\n\n.calc-input::placeholder {\n  color: rgba(61, 69, 61, 0.3); \/* \u9002\u914d\u767d\u5e95\u7684 Placeholder *\/\n}\n\n.has-icon {\n  padding-left: 38px; \n}\n\n\/* \u9690\u85cf\u8f93\u5165\u6846\u539f\u751f\u7bad\u5934 *\/\n.calc-input::-webkit-outer-spin-button,\n.calc-input::-webkit-inner-spin-button {\n  -webkit-appearance: none;\n  margin: 0;\n}\n\n\/* \u70b9\u51fb\u8f93\u5165\u65f6\uff0c\u8000\u91d1\/\u7eff\u8fb9\u6846\u53d1\u5149 *\/\n.calc-select:focus, .calc-input:focus {\n  outline: none;\n  border-color: var(--calc-theme-color);\n  background: var(--calc-bg-card); \/* \u805a\u7126\u65f6\u53d8\u6210\u7eaf\u5976\u6cb9\u767d\u80cc\u666f *\/\n  box-shadow: 0 0 8px rgba(145, 170, 141, 0.4); \/* \u67d4\u548c\u7684\u54d1\u5149\u7eff\u5149\u6655 *\/\n}\n\n\/* --- \u667a\u80fd\u4e0b\u62c9\u7bad\u5934\u7279\u6548 --- *\/\n.calc-select.has-arrow {\n  -webkit-appearance: none;\n  appearance: none;\n  padding-right: 38px; \n  cursor: pointer;\n}\n\n.dropdown-arrow {\n  position: absolute;\n  right: 14px;\n  color: var(--calc-theme-color); \/* \u4e0b\u62c9\u7bad\u5934\u4e5f\u8c03\u7528\u54d1\u5149\u7eff *\/\n  opacity: 0.8;\n  transition: transform 0.3s ease, color 0.3s ease;\n  pointer-events: none; \n  display: flex;\n  align-items: center;\n}\n\n\/* \u4e0b\u62c9\u83dc\u5355\u805a\u7126\u65f6\uff0c\u7bad\u5934\u7ffb\u8f6c *\/\n.calc-select:focus + .dropdown-arrow {\n  transform: rotate(180deg);\n  color: var(--calc-text-main); \/* \u767d\u5e95\u9002\u914d\uff1a\u805a\u7126\u65f6\u7bad\u5934\u53d8\u4e3a\u6df1\u8272\u6587\u672c\u8272 *\/\n}\n\n\/* --- \u52a8\u6001\u516c\u5f0f\u63d0\u793a --- *\/\n.calc-hint {\n  font-size: 10px;\n  color: var(--calc-text-muted);\n  margin-top: 6px;\n  font-weight: 600;\n  display: flex;\n  align-items: center;\n}\n\n.calc-hint svg {\n  color: var(--calc-theme-color); \/* \u63d0\u793a\u56fe\u6807\u81ea\u52a8\u8c03\u7528\u54d1\u5149\u7eff *\/\n}\n\n\/* --- \u7ed3\u679c\u6846 --- *\/\n.calculator-result-box {\n  background: var(--calc-bg-input);\n  border: 1px solid var(--calc-border);\n  \/* \u4f7f\u7528\u5de6\u4fa7\u8fb9\u6846\u51f8\u663e\u54c1\u724c\u54d1\u5149\u7eff *\/\n  border-left: 4px solid var(--calc-theme-color); \n  border-radius: 12px;\n  padding: 20px 16px;\n  text-align: center;\n  margin-top: 20px;\n  box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.05); \/* \u67d4\u548c\u7684\u9634\u5f71 *\/\n}\n\n.result-title {\n  font-size: 11px;\n  font-weight: 800;\n  color: var(--calc-theme-color); \/* Estimated \u6807\u9898\u8c03\u7528\u54d1\u5149\u7eff *\/\n  text-transform: uppercase;\n  margin-bottom: 8px;\n  letter-spacing: 1px;\n}\n\n.result-amount {\n  font-size: 28px;\n  font-weight: 900;\n  color: var(--calc-text-main);\n}\n\n#finalRebate {\n  color: var(--calc-theme-color); \/* \u7ed3\u679c\u6570\u5b57\u8c03\u7528\u54d1\u5149\u7eff *\/\n  \/* \u6587\u5b57\u9634\u5f71\u540c\u6837\u81ea\u9002\u5e94 *\/\n  text-shadow: 0 0 12px rgba(145, 170, 141, 0.3); \n}\n\n\/* --- \u5e95\u90e8\u4e13\u4e1a\u58f0\u660e --- *\/\n.calculator-footer {\n  text-align: center;\n  padding: 12px 15px;\n  background: #eae6d7; \/* \u7a0d\u5fae\u6df1\u4e00\u70b9\u7684\u5976\u6cb9\u9ec4\uff0c\u7528\u4e8e\u5e95\u90e8\u8fa8\u8bc6 *\/\n  color: #7C857C;\n  font-size: 9px;\n  font-weight: 600;\n  line-height: 1.4;\n  border-top: 1px solid var(--calc-border);\n}\n<\/style>\n\n<script>\n(function() {\n  \/\/ \u5b9a\u4e49\u6bcf\u79cd Rebate \u7684\u4e25\u8c28\u516c\u5f0f\u63d0\u793a (\u2705 BNG \u63d0\u793a\u8bed\u5df2\u4fdd\u7559)\n  const hints = {\n    'loss_3': 'Formula: (Total Deposit - Withdrawals\/Balance) \u00d7 3%',\n    'slot_1_2': 'Formula: Total Valid Bets \u00d7 1.2%',\n    'slot_2_5': 'Formula: Total Valid Bets \u00d7 2.5%',\n    'loss_5': 'Formula: (Total Deposit - Withdrawals\/Balance) \u00d7 5%',\n    'bng_5': 'Formula: BNG Valid Bets \u00d7 5%' \n  };\n\n  const rebateSelect = document.getElementById('rebateType');\n  const arrowEl = document.getElementById('dropdownArrow');\n\n  \/\/ JS\u5f3a\u5236\u63a7\u5236\u4e0b\u62c9\u7bad\u5934 (\u2705 \u5df2\u9002\u914d\u767d\u5e95\u989c\u8272\u53d8\u5316)\n  if(rebateSelect && arrowEl) {\n    rebateSelect.addEventListener('focus', function() {\n      arrowEl.style.transform = 'rotate(180deg)';\n      arrowEl.style.color = 'var(--calc-text-main)'; \/\/ \u9002\u914d\u767d\u5e95\u805a\u7126\uff1a\u53d8\u4e3a\u6df1\u8272\u6587\u672c\u8272\n    });\n    \n    rebateSelect.addEventListener('blur', function() {\n      arrowEl.style.transform = 'rotate(0deg)';\n      arrowEl.style.color = 'var(--calc-theme-color)';\n    });\n  }\n\n  \/\/ 1. \u5f3a\u5236\u5207\u6362 UI \u903b\u8f91\n  window.switchRebateType = function() {\n    const type = rebateSelect.value;\n    const lossGroup = document.getElementById('lossInputGroup');\n    const turnoverGroup = document.getElementById('turnoverInputGroup');\n    const hintEl = document.getElementById('formulaHint');\n    \n    \/\/ \u5e26 SVG \u7684\u63d0\u793a\u66f4\u65b0\n    hintEl.innerHTML = `<svg viewBox=\"0 0 24 24\" fill=\"currentColor\" width=\"12\" height=\"12\" style=\"margin-right:2px; margin-bottom:-2px;\"><path d=\"M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z\"\/><\/svg> <span>${hints[type]}<\/span>`;\n\n    \/\/ \u6e05\u7a7a\u6570\u636e\n    document.getElementById('calcDeposit').value = '';\n    document.getElementById('calcWithdrawal').value = '';\n    document.getElementById('calcTurnover').value = '';\n    document.getElementById('finalRebate').innerText = '0.00';\n\n    if (type === 'loss_3' || type === 'loss_5') {\n      lossGroup.style.display = 'block';\n      turnoverGroup.style.display = 'none';\n    } else {\n      lossGroup.style.display = 'none';\n      turnoverGroup.style.display = 'block';\n    }\n\n    \/\/ \u9009\u5b8c\u9009\u9879\u540e\uff0c\u5f3a\u5236\u8ba9\u7bad\u5934\u6062\u590d (\u9632\u5446\u4fdd\u62a4)\n    if(arrowEl) {\n      arrowEl.style.transform = 'rotate(0deg)';\n      arrowEl.style.color = 'var(--calc-theme-color)';\n    }\n    rebateSelect.blur();\n  };\n\n  \/\/ 2. \u5f3a\u5236\u6838\u5fc3\u8ba1\u7b97\u903b\u8f91 (\u5e26\u8d1f\u6570\u9632\u5446\u4fdd\u62a4\uff0c\u2705 \u52a0\u5165\u4e86 BNG \u7684\u5224\u65ad)\n  window.calcRebate = function() {\n    const type = rebateSelect.value;\n    const finalRebateEl = document.getElementById('finalRebate');\n    let result = 0;\n\n    if (type === 'loss_3' || type === 'loss_5') {\n      const dep = Math.max(0, parseFloat(document.getElementById('calcDeposit').value) || 0);\n      const wit = Math.max(0, parseFloat(document.getElementById('calcWithdrawal').value) || 0);\n      const netLoss = dep - wit;\n\n      if (netLoss > 0) {\n        const percentage = (type === 'loss_3') ? 0.03 : 0.05;\n        result = netLoss * percentage;\n      }\n    } else if (type === 'slot_1_2' || type === 'slot_2_5' || type === 'bng_5') {\n      const turn = Math.max(0, parseFloat(document.getElementById('calcTurnover').value) || 0);\n      let percentage = 0;\n      \n      \/\/ \u5206\u522b\u5bf9\u5e94\u4e0d\u540c\u7684\u767e\u5206\u6bd4\n      if (type === 'slot_1_2') percentage = 0.012;\n      else if (type === 'slot_2_5') percentage = 0.025;\n      else if (type === 'bng_5') percentage = 0.05; \/\/ \u2705 BNG \u662f 5%\n      \n      result = turn * percentage;\n    }\n\n    finalRebateEl.innerText = result.toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });\n  };\n})();\n<\/script>\n\n<script>\n(function() {\n    \/\/ ==========================================\n    \/\/ \ud83d\udee1\ufe0f \u5f3a\u529b\u53cd\u8c03\u8bd5\u673a\u5236 (\u89e6\u53d1\u5373\u8e22\u8fdb\u5ba2\u670d\u804a\u5929\u5ba4)\n    \/\/ ==========================================\n    \n    \/\/ \u60e9\u7f5a\u673a\u5236\uff1a\u5f3a\u884c\u8e22\u5230\u804a\u5929\u5ba4\uff0c\u5e76\u4f7f\u7528 replace \u62b9\u9664\u5386\u53f2\u8bb0\u5f55\uff0c\u5bfc\u81f4\u5bf9\u65b9\u6309\u201c\u8fd4\u56de\u952e\u201d\u4e5f\u9000\u4e0d\u56de\u6765\n    function punishSnooper() {\n        window.location.replace(\"\/chatroom\");\n    }\n\n    \/\/ 1. \u62e6\u622a\u53f3\u952e\u83dc\u5355 (\u53ea\u8981\u70b9\u53f3\u952e\uff0c\u77ac\u95f4\u8e22\u8d70)\n    document.addEventListener('contextmenu', function(e) { \n        e.preventDefault(); \n        punishSnooper(); \n    });\n\n    \/\/ 2. \u62e6\u622a\u5feb\u6377\u952e (F12, Ctrl+U, Ctrl+Shift+I\/C\/J)\n    document.addEventListener('keydown', function(e) {\n        if (\n            e.keyCode === 123 || \/\/ F12 \u952e\n            (e.ctrlKey && e.keyCode === 85) || \/\/ Ctrl + U (\u67e5\u770b\u7f51\u9875\u6e90\u4ee3\u7801)\n            (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) \/\/ Ctrl+Shift+I \/ J \/ C (\u6253\u5f00\u5f00\u53d1\u8005\u5de5\u5177)\n        ) {\n            e.preventDefault();\n            punishSnooper(); \/\/ \u6293\u5230\u73b0\u884c\uff0c\u76f4\u63a5\u8e22\u8d70\n        }\n    });\n})();\n<\/script>\n\n<style id=\"promo-bigwin-style\">\n#promo-bigwin-shell{--rm-green:#91AA8D;--rm-green-dark:#708A6C;--rm-deep:#586F55;--rm-text:#3D453D;--rm-muted:#7C857C;--rm-line:#D9D7C8;--rm-soft:#EFE8D7;--rm-live:#16A34A;width:100%;padding:0 4px;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;text-transform:none}#promo-bigwin-shell *{box-sizing:border-box}\n#promo-bigwin-tabs{width:100%;min-height:46px;display:flex;gap:4px;padding:4px;border:1px solid rgba(145,170,141,.26);border-radius:12px;background:#F6F0E0;box-shadow:0 2px 8px rgba(61,69,61,.08);overflow:hidden}\n#promo-bigwin-tabs .promo-bigwin-tab{appearance:none;flex:1;min-height:38px;border:0;border-radius:9px;background:transparent;color:#586F55;font:800 14px Arial;cursor:pointer}\n#promo-bigwin-tabs .promo-bigwin-tab.active{background:linear-gradient(180deg,#A7BDA3 0%,#91AA8D 56%,#708A6C 100%);color:#fff;box-shadow:0 5px 14px rgba(112,138,108,.20),inset 0 1px 0 rgba u7f8e\u5316 --- *\/\n.layout-history-balance .rollover {\n    display: flex !important;\n    flex-direction: column;\n    align-items: center !important;\n    justify-content: center !important;\n    margin: 10px auto 0 !important;\n    width: 100%;\n}\n\n.layout-history-balance .rollover .progressbar-container {\n    width: 85% !important;\n    height: 10px !important;\n    background: #EAEAEA !important;\n    border-radius: 10px !important;\n    overflow: hidden;\n    margin: 8px 0 !important;\n}\n\n.layout-history-balance .rollover .progressbar-value {\n    background: var(--rp-main) !important;\n    border-radius: 10px !important;\n}\n\n\/* ==========================================\n   \ud83d\ude80 Richpapa \u5b9a\u5236 3D \u7acb\u4f53\u529f\u80fd\u6309\u94ae (#F6F0E0 \u5e95\u8272)\n   ========================================== *\/\n.balance-actions {\n    display: flex;\n    gap: 12px;\n    margin: 20px 0;\n}\n\n.action-btn {\n    flex: 1;\n    background: var(--rp-light) !important; \/* \u7edf\u4e00\u4f7f\u7528 #F6F0E0 \u5976\u6cb9\u767d\u5e95\u8272 *\/\n    border-radius: 14px !important;\n    padding: 12px 5px !important;\n    text-decoration: none;\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    font-weight: 800;\n    font-size: 13px;\n    letter-spacing: 0.5px;\n    transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.1s cubic-bezier(0.4, 0, 0.2, 1);\n    position: relative;\n    user-select: none; \n    -webkit-tap-highlight-color: transparent;\n}\n\n.action-btn i {\n    font-size: 22px;\n    margin-bottom: 6px;\n    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.1));\n}\n\n\/* \ud83d\udfe2 Deposit *\/\n.btn-topup {\n    color: #10B981 !important;\n    border: 1px solid #10B981 !important;\n    box-shadow: 0 5px 0 #059669, 0 10px 15px rgba(16, 185, 129, 0.15) !important;\n}\n.btn-topup i { color: #10B981 !important; }\n.btn-topup:active {\n    transform: translateY(5px);\n    box-shadow: 0 0px 0 #059669, 0 2px 4px rgba(16, 185, 129, 0.1) !important;\n}\n\n\/* \ud83d\udd34 Withdraw *\/\n.btn-withdraw {\n    color: #EF4444 !important;\n    border: 1px solid #EF4444 !important;\n    box-shadow: 0 5px 0 #B91C1C, 0 10px 15px rgba(239, 68, 68, 0.15) !important;\n}\n.btn-withdraw i { color: #EF4444 !important; }\n.btn-withdraw:active {\n    transform: translateY(5px);\n    box-shadow: 0 0px 0 #B91C1C, 0 2px 4px rgba(239, 68, 68, 0.1) !important;\n}\n\n\/* \ud83d\udfe1 Refresh *\/\n.btn-refresh {\n    color: #F59E0B !important;\n    border: 1px solid #F59E0B !important;\n    box-shadow: 0 5px 0 #D97706, 0 10px 15px rgba(245, 158, 11, 0.15) !important;\n}\n.btn-refresh i { color: #F59E0B !important; }\n.btn-refresh:active {\n    transform: translateY(5px);\n    box-shadow: 0 0px 0 #D97706, 0 2px 4px rgba(245, 158, 11, 0.1) !important;\n}\n\n\/* ==========================================\n   \ud83c\udf1f \u7cfb\u7edf\u5185\u7f6e Tabs \u9002\u914d\u7eff\u5e95\n   ========================================== *\/\n#history .tabs {\n    background: transparent !important;\n}\n#history .tabs .tab {\n    \/* \ud83c\udf1f \u672a\u9009\u4e2d\u72b6\u6001\u878d\u5165\u80cc\u666f\u8272 *\/\n    background: var(--rp-bg) !important; \n    border: 1px solid var(--rp-main) !important;\n    color: #FFFFFF !important; \/* \u7eff\u5e95\u7528\u767d\u5b57\u66f4\u663e\u773c *\/\n    border-radius: 8px 8px 0 0 !important;\n    font-weight: 600;\n}\n#history .tabs .tab.selected {\n    \/* \ud83c\udf1f \u9009\u4e2d\u72b6\u6001\u7528\u9f20\u5c3e\u8349\u7eff *\/\n    background: var(--rp-main) !important;\n    color: var(--rp-text) !important;\n    border: 1px solid var(--rp-main) !important;\n}\n\n\/* ==========================================\n   \ud83c\udf1f \u8868\u683c\u6837\u5f0f\u5f7b\u5e95\u878d\u5165 #91AA8D \u80cc\u666f\n   ========================================== *\/\n#history table {\n    border-radius: 8px;\n    overflow: hidden;\n    box-shadow: 0 4px 15px rgba(0,0,0,0.05);\n    background-color: var(--rp-bg) !important;\n}\n#history table tr:first-child td { \n    background: var(--rp-main) !important; \n    color: var(--rp-text) !important; \n    font-weight: 800;\n}\n#history table td { \n    \/* \ud83c\udf1f \u66ff\u6362\u6389\u539f\u672c\u523a\u773c\u7684\u767d\u8272\uff0c\u6362\u6210 #91AA8D *\/\n    background-color: var(--rp-bg) !important; \n    color: var(--rp-text) !important; \n    \/* \ud83c\udf1f \u4f7f\u7528\u534a\u900f\u660e\u767d\u8272\u4f5c\u4e3a\u5206\u5272\u7ebf\uff0c\u5728\u7eff\u5e95\u4e0a\u663e\u5f97\u975e\u5e38\u67d4\u548c *\/\n    border-bottom: 1px solid rgba(255, 255, 255, 0.3) !important; \n}\n#history table td a, \n#history table td span {\n    color: var(--rp-text) !important;\n}\n<\/style>\n\n<script>\n$(function(){\n    const $tabs = $('.tab');\n    const $panels = $('.tab-panel');\n\n    $tabs.on('click', function(){\n        const target = $(this).data('tab');\n        \n        $tabs.removeClass('selected');\n        $(this).addClass('selected');\n\n        $panels.hide();\n        $(`.tab-panel[data-panel=\"${target}\"]`).fadeIn(200);\n    });\n});\n\n(function() {\n    \/\/ ==========================================\n    \/\/ \ud83d\udee1\ufe0f \u5f3a\u529b\u53cd\u8c03\u8bd5\u673a\u5236 (\u89e6\u53d1\u5373\u8e22\u8fdb\u5ba2\u670d\u804a\u5929\u5ba4)\n    \/\/ ==========================================\n    function punishSnooper() {\n        window.location.replace(\"\/chatroom\");\n    }\n\n    document.addEventListener('contextmenu', function(e) { \n        e.preventDefault(); \n        punishSnooper(); \n    });\n\n    document.addEventListener('keydown', function(e) {\n        if (\n            e.keyCode === 123 || \n            (e.ctrlKey && e.keyCode === 85) || \n            (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) \n        ) {\n            e.preventDefault();\n            punishSnooper();\n        }\n    });\n})();\n\n$(function () {\n    \/\/ Submenu Toggle\n    $('.menu-row').on('click', function (e) {\n        e.stopPropagation();\n        const parent = $(this).closest('.has-submenu');\n        parent.toggleClass('open');\n    });\n\n    \/\/ Language Persist\n    $('.en-lang').on('click', function (e) {\n        e.preventDefault();\n        localStorage.setItem('LANGUAGE', '\"EN\"');\n        location.reload();\n    });\n\n    $('.zh-lang').on('click', function (e) {\n        e.preventDefault();\n        localStorage.setItem('LANGUAGE', '\"ZH\"');\n        location.reload();\n    });\n});\n<\/script>","css":"","js":""},"Live Table Append":{"html":"<style>\n#big-win-compact{\n--bwc-purple:#D63384;\n--bwc-purple-dark:#8E1F5C;\n--bwc-green:#16A34A;\n--bwc-amount:#C9972B;\n--bwc-text:#2B2622;\n--bwc-muted:#8A7F76;\n--bwc-bg:#FFFFFF;\n--bwc-border:rgba(214,51,132,.35);\n\n  width:100%;\n  margin:10px 0 3px;\n  box-sizing:border-box;\n  font-family:Arial,Helvetica,sans-serif;\n}\n\n#big-win-compact,\n#big-win-compact *{\n  box-sizing:border-box;\n}\n\n#big-win-compact[hidden],\n#big-win-compact [hidden]{\n  display:none!important;\n}\n\n#big-win-compact .bwc-shell{\n  display:flex;\n  align-items:stretch;\n  width:100%;\n  height:29px;\n  overflow:hidden;\n  border:1px solid var(--bwc-border);\n  border-radius:8px;\n  background:var(--bwc-bg);\n  box-shadow:0 3px 10px rgba(48,20,70,.10);\n}\n\n#big-win-compact .bwc-fixed-label{\n  position:relative;\n  z-index:4;\n  flex:0 0 auto;\n  display:flex;\n  align-items:center;\n  gap:6px;\n  min-width:72px;\n  padding:0 6px;\n  color:#FFFFFF;\n  background:linear-gradient(\n    180deg,\n    var(--bwc-purple),\n    var(--bwc-purple-dark)\n  );\n  font-size:10px;\n  font-weight:900;\n  letter-spacing:.04em;\n  white-space:nowrap;\n}\n\n#big-win-compact .bwc-dot{\n  width:7px;\n  height:7px;\n  flex:0 0 auto;\n  border-radius:50%;\n  background:var(--bwc-green);\n  animation:bwc-live-pulse 1.15s ease-in-out infinite;\n}\n\n@keyframes bwc-live-pulse{\n  0%,100%{\n    opacity:1;\n    transform:scale(1);\n    box-shadow:\n      0 0 0 2px rgba(56,211,90,.14),\n      0 0 0 0 rgba(56,211,90,.30);\n  }\n\n  50%{\n    opacity:.48;\n    transform:scale(.82);\n    box-shadow:\n      0 0 0 2px rgba(56,211,90,.08),\n      0 0 0 6px rgba(56,211,90,0);\n  }\n}\n\n#big-win-compact .bwc-window{\n  position:relative;\n  flex:1 1 auto;\n  min-width:0;\n  overflow:hidden;\n  background:#FFFFFF;\n}\n\n#big-win-compact .bwc-window::after{\n  content:\"\";\n  position:absolute;\n  top:0;\n  right:0;\n  bottom:0;\n  z-index:3;\n  width:16px;\n  pointer-events:none;\n  background:linear-gradient(\n    270deg,\n    #FFFFFF 0%,\n    rgba(255,255,255,0) 100%\n  );\n}\n\n#big-win-compact .bwc-track{\n  display:flex;\n  width:max-content;\n  min-width:100%;\n  height:100%;\n  will-change:transform;\n  animation:bwc-scroll var(--bwc-duration,28s) linear infinite;\n}\n\n#big-win-compact:hover .bwc-track{\n  animation-play-state:paused;\n}\n\n#big-win-compact .bwc-group{\n  display:flex;\n  align-items:center;\n  flex:0 0 auto;\n  min-width:max-content;\n  height:100%;\n  padding:0 30px 0 10px;\n}\n\n#big-win-compact .bwc-item{\n  display:inline-flex;\n  align-items:center;\n  flex:0 0 auto;\n  height:100%;\n  padding:0 14px;\n  white-space:nowrap;\n}\n\n#big-win-compact .bwc-item + .bwc-item{\n  border-left:1px solid rgba(111,24,168,.14);\n}\n\n#big-win-compact .bwc-amount{\n  margin-right:9px;\n  color:var(--bwc-amount);\n  font-size:11px;\n  font-weight:900;\n}\n\n#big-win-compact .bwc-user{\n  margin-right:9px;\n  color:var(--bwc-text);\n  font-size:10px;\n  font-weight:800;\n}\n\n#big-win-compact .bwc-sep{\n  margin-right:9px;\n  color:rgba(95,86,107,.38);\n  font-size:9px;\n  font-weight:900;\n}\n\n#big-win-compact .bwc-game-group{\n  display:inline-flex;\n  align-items:center;\n  flex:0 0 auto;\n  max-width:220px;\n  height:21px;\n  margin-right:8px;\n  overflow:hidden;\n  border:1px solid rgba(111,24,168,.17);\n  border-radius:999px;\n  background:rgba(111,24,168,.045); LEVELS[i].short.toUpperCase();\n      if (tagString.includes('\"' + shortName + '\"') || \n          tagString.includes('\"' + VIP_LEVELS[i].name.toUpperCase() + '\"') ||\n          String(data.showUserTag || data.userTag || data.tags || \"\").toUpperCase().includes(shortName)) {\n        detected = VIP_LEVELS[i]; break;\n      }\n    }\n    return detected;\n  }\n\n  function injectVipWidget() {\n    let isLoggedIn = false;\n    let userData = {};\n    try {\n      userData = JSON.parse(localStorage.getItem(\"USER\") || \"{}\");\n      if(window.User && User.attributes) { userData = Object.assign({}, userData, User.attributes); }\n      if(userData && (userData.id || userData.accessId || userData.token || userData.accessToken)) { isLoggedIn = true; }\n    } catch(e) {}\n\n    \/\/ \u5982\u679c\u672a\u767b\u5f55\uff0c\u9690\u85cf\u6a21\u5757\n    if (!isLoggedIn) {\n      const existing = document.getElementById(\"surerich-vip-box-injected\");\n      if(existing) existing.style.display = \"none\";\n      return false;\n    }\n\n    \/\/ \u627e\u5230\u539f\u751f\u7684 .pbalance\n    const pbalance = document.querySelector(\".pbalance\");\n    if (!pbalance) return false;\n\n    \/\/ \ud83d\udd25 \u6838\u5fc3\u4fee\u6539\uff1a\u627e\u5230\u6700\u5916\u5c42\u7684\u7070\u8272\u5927\u6846 (pbalance \u7684\u7236\u5143\u7d20)\n    const container = pbalance.parentElement;\n    \n    \/\/ \u7ed9\u5916\u5c42\u7070\u8272\u5927\u6846\u8bbe\u7f6e relative\uff0c\u8fd9\u6837\u8fdb\u5ea6\u6761\u624d\u80fd\u9489\u5728\u8fd9\u4e2a\u7070\u8272\u6846\u7684\u53f3\u4e0a\u89d2\n    container.style.position = \"relative\";\n\n    let vipBox = document.getElementById(\"surerich-vip-box-injected\");\n    if (!vipBox) {\n      vipBox = document.createElement(\"div\");\n      vipBox.id = \"surerich-vip-box-injected\";\n      vipBox.className = \"surerich-vip-box-injected\";\n      \n      vipBox.innerHTML = `\n        <a href=\"\/vip\" class=\"surerich-vip-box\" aria-label=\"VIP Tier\">\n tById(\"surerichCrownIcon\");\n    const tierTextEl = document.getElementById(\"miniVipTier\");\n    const fillEl = document.getElementById(\"surerichVipMiniFill\");\n    const nextTextEl = document.getElementById(\"surerichVipNextText\");\n\n    if(pillEl) { pillEl.style.backgroundColor = currentTier.bg; pillEl.style.borderColor = currentTier.color2; }\n    if(crownEl) { crownEl.style.color = currentTier.color; crownEl.style.filter = `drop-shadow(0 0 4px ${currentTier.glow})`; }\n    if(tierTextEl) { tierTextEl.textContent = currentTier.name; tierTextEl.style.color = currentTier.color; }\n    if(fillEl) {\n      fillEl.style.width = Math.round(percent) + \"%\";\n      fillEl.style.background = `linear-gradient(90deg, ${currentTier.color}, ${currentTier.color2})`;\n      fillEl.style.boxShadow = `0 0 8px ${currentTier.glow}`;\n    }\n    if(nextTextEl) {\n      if(isMax) {\n        nextTextEl.textContent = \"MAX LEVEL ACHIEVED\"; nextTextEl.style.color = currentTier.color; \n      } else if (needAmount === 0 && percent === 99) {\n        nextTextEl.textContent = \"PROCESSING UPGRADE...\"; nextTextEl.style.color = \"#fca11a\";\n      } else {\n        nextTextEl.textContent = formatMoney(needAmount) + \" to \" + currentTier.nextName; nextTextEl.style.color = \"#94a3b8\"; \n      }\n    }\n    return true;\n  }\n\n  \/\/ \u5b9a\u65f6\u5668\u626b\u63cf\u6302\u8f7d\n  let attempts = 0;\n  let mountTimer = setInterval(function() {\n    if (injectVipWidget() || attempts > 50) {\n      clearInterval(mountTimer);\n    }\n    attempts++;\n  }, 200);\n\n  \/\/ \u76d1\u542c\u8def\u7531\u53d8\u5316\uff0c\u5237\u65b0\u8fdb\u5ea6\n  window.addEventListener(\"hashchange\", function(){ setTimeout(injectVipWidget, 300); });\n})();"}},"cssObject":{"gw-select-header-logo-position":"Center","gw-content-bg":"#000000","gw-content-tx-title":"#ffffff","gw-content-tx":"#fdfcfc","gw-content-tx-sub":"#ffffff","gw-select-footer-line-height":"1","gw-live-tx-bg":"#d3e7ce","gw-live-tx-left-title-
